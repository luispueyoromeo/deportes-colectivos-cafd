<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Herramienta docente para consultar recursos, observar partidos y diseñar sesiones de Deportes Colectivos del Grado en CAFD de la Universidad de Zaragoza."
    />
    <title>Deportes Colectivos CAFD</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <a class="brand" href="#inicio" aria-label="Ir al inicio">
          <img class="brand-logo" src="/src/assets/logo-deportes-colectivos.svg" alt="Deportes Colectivos · Universidad de Zaragoza" />
          <strong class="brand-title">Deportes Colectivos CAFD</strong>
        </a>
        <nav id="main-nav" aria-label="Navegación principal"></nav>
      </header>

      <main id="app" tabindex="-1"></main>

        <p>Primera versión docente sin login, sin subida directa de archivos y sin conexión con Google Drive API.</p>

    <script type="module" src="/src/app.js"></script>
